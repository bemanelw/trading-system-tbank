version: '3.7'

services:
  chernyugov-trading-bot:
    image: 'chernyugov/trading:live-latest'
    container_name: chernyugov-trading-bot
    network_mode: host
    environment:
      - server.port=10000
      - spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/invest
      - spring.datasource.username=${POSTGRES_USER}
      - spring.datasource.password=${POSTGRES_PASSWORD}
      - candle.listener.enabled=true
      - tinkoff.emulator=false
      - tinkoff.is-token-sandbox=false
      - tinkoff.token=${TINKOFF_TOKEN}
      - tinkoff.account-id=2090809704
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M