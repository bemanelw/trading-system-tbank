version: '3'

services:
  chernyugov-trading-bot-sandbox:
    image: 'chernyugov/trading:sandbox-2-latest'
    container_name: chernyugov-trading-bot-sandbox-2
    network_mode: host
    environment:
      - server.port=10003
      - spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/trading-sandbox-2
      - spring.datasource.username=${POSTGRES_USER}
      - spring.datasource.password=${POSTGRES_PASSWORD}
      - candle.listener.enabled=true
      - tinkoff.emulator=false
      - tinkoff.is-token-sandbox=true
      - tinkoff.token=${TINKOFF_TOKEN_SANDBOX}
      - tinkoff.account-id=415b7f7e-a91a-4e07-af0a-7097ed0c2fa6
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M